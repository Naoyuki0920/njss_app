# L2: ルールベース判定（CSVの列だけで確実に判定できるもの）
#
# ここで除外できた案件は公告文の取得もLLM判定も行わないため、
# 実行時間とAPIコストが直接下がる。
# 判断に迷いが生じうる条件は config/criteria.md（LLM判定）側に置いている。

exclude:
  # 【条件1】指名競争入札の案件は対象外
  # CSVの列[2]入札形式で確実に判定できる
  - field: bid_type
    contains_any: ["指名競争入札"]
    reason: "指名競争入札のため対象外"

  # 【条件6】ESCO事業関連案件は対象外
  # 案件名に現れるものをここで落とす。案件概要にしか現れない場合は
  # criteria.md 側のLLM判定で拾う
  - field: name
    contains_any: ["ESCO", "ＥＳＣＯ", "エスコ事業"]
    reason: "ESCO事業関連のため対象外"

  # 締切が近すぎて実質応札できない案件
  # ※この日数は運用しながら調整してください。0にすると無効化されます
  - field: deadline_on
    within_days: 3
    reason: "締切まで3日以内で実質応札できない"

# 無条件で採用する案件。公告文もLLM判定もスキップするため、
# 確実に応札対象と分かっているものだけを書くこと。
promote: []

# 入札参加資格の等級による絞り込み。
# 自社の保有等級を書くと、案件の要求等級と1つも重ならない場合に除外する。
# 空リストなら等級による判定をしない。
# 実データ例: 「広島市競争入札参加資格 建設・土木・工事系 A」-> 等級 A
grades:
  owned: []          # 例: ["A", "B"]
  reason: "自社の保有等級では参加できない"
