[project]
name = "njss-digest"
version = "0.1.0"
description = "NJSSのCSVから案件を判定し、チーム配信用メール下書きを生成する"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    # www.kkj.go.jp の証明書チェーン(JPRS)がcertifiのCAバンドルに無いため、
    # OSのトラストストアで検証する。証明書検証は有効なまま。
    "truststore>=0.9",
    # 公示書PDFの読み取り（pdftotext があればそちらを優先）
    "pypdf>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
watch = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
njss-digest = "njss_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/njss_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
